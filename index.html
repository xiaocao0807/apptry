<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的旅遊紀錄平台 - Travel Dashboard (Blue-Green Edition)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // === 更新：低飽和度藍綠色調 ===
                        'jp-blue-light': '#D1E8E2',      // 極淺薄荷綠
                        'jp-white': '#F4F7F6',           // 極淡藍綠灰 (背景)
                        'jp-blue-dark': '#4C7B7B',       // 莫蘭迪深藍綠 (主色)
                        'jp-accent-green': '#A9CBB7',    // 鼠尾草綠
                        'jp-accent-pink': '#E2B1B1',     // 藕粉色
                        'jp-accent-yellow': '#F3E5AB'    // 象牙黃
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #E9EFEE; 
            margin: 0;
            padding: 0;
        }

        #app {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
            background-color: theme('colors.jp-white');
            padding-bottom: 80px;
        }
        
        .app-header {
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .date-card {
            min-width: 75px;
            height: 65px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .itinerary-card {
            background-color: white;
            position: relative;
            overflow: hidden; 
            transition: all 0.3s ease;
        }

        .itinerary-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
            z-index: 1;
        }

        .itinerary-content-wrapper { position: relative; z-index: 2; display: flex; align-items: center; width: 100%; }
        .itinerary-left-column { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; margin-right: 12px; width: 45px; }
        .itinerary-icon-circle { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 2px; }
        .itinerary-time { font-size: 0.7rem; color: #6B7280; font-weight: 500; }

        .action-button-group { position: absolute; top: 2px; right: 2px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
        .action-button-circle { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #E5E7EB; background-color: white; color: #9CA3AF; transition: all 0.2s; }
        .action-button-circle:hover { border-color: theme('colors.jp-blue-dark'); color: theme('colors.jp-blue-dark'); }

        .itinerary-main-content { flex-grow: 1; width: calc(100% - 100px); max-width: calc(100% - 100px); }
        .itinerary-notes { padding: 6px 10px; background-color: #F8FAFA; border-radius: 6px; margin-top: 6px; font-size: 0.8rem; color: #4B5563; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
    </style>
</head>
<body>

<div id="app">
    <header class="app-header bg-jp-blue-dark text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold">
            <span v-if="currentView === 'home'">旅遊儀表板</span>
            <span v-else class="flex items-center space-x-2">
                 <button @click="goHome" class="p-1 rounded-full hover:bg-white/20"><i class="fas fa-arrow-left"></i></button>
                 <span class="truncate">{{ selectedTrip.name }}</span>
            </span>
        </h1>
        <div v-if="currentView === 'home'">
            <button @click="showAddTripModal = true" class="p-2 rounded-full hover:bg-white/20"><i class="fas fa-plus"></i></button>
        </div>
    </header>

    <main v-if="currentView === 'home'" class="p-4">
        <div class="flex justify-end items-center mb-4 text-sm text-gray-500">
            <label class="mr-2">顯示已完成項目</label>
            <input type="checkbox" v-model="showCompleted" class="rounded text-jp-blue-dark">
        </div>

        <div class="space-y-4">
            <div v-for="trip in filteredTrips" :key="trip.id" @click="goToTrip(trip)"
                 class="p-4 rounded-xl shadow-sm bg-white border-l-4 border-jp-blue-dark flex justify-between items-center cursor-pointer active:scale-95 transition">
                <div>
                    <p class="text-[10px] font-bold text-jp-blue-dark opacity-70 uppercase tracking-widest">{{ trip.type }}</p>
                    <h3 class="text-lg font-bold text-gray-800">{{ trip.name }}</h3>
                    <p class="text-xs text-gray-500"><i class="far fa-calendar-alt mr-1"></i> {{ trip.startDate }} ~ {{ trip.endDate }}</p>
                </div>
                <button @click.stop="confirmRemoveTrip(trip.id, trip.name)" class="text-gray-300 hover:text-red-400 p-2"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>
    </main>

    <section v-if="currentView === 'tripDetail'" class="p-4">
        <div class="mb-4 p-3 bg-white/80 backdrop-blur rounded-2xl flex items-center justify-between border border-jp-blue-light shadow-sm">
            <div class="flex items-center">
                <div class="w-10 h-10 bg-jp-blue-light/30 rounded-full flex items-center justify-center mr-3">
                    <i class="fas fa-cloud-sun text-jp-blue-dark text-xl"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-tight">Current Weather</p>
                    <p class="text-sm font-bold text-gray-700">目的地 - 局部多雲</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xl font-bold text-jp-blue-dark">22°C</p>
                <p class="text-[10px] text-jp-accent-green font-bold">降雨機率 5%</p>
            </div>
        </div>

        <div class="flex overflow-x-auto whitespace-nowrap space-x-2 pb-2 mb-4 hide-scrollbar">
            <div v-for="(date, index) in selectedTrip.data.dates" :key="index"
                 @click="selectedTrip.data.selectedDateIndex = index"
                 :class="['date-card rounded-2xl transition-all duration-300 shadow-sm', 
                          selectedTrip.data.selectedDateIndex === index ? 'bg-jp-blue-dark text-white scale-105' : 'bg-white text-gray-400']">
                <span class="text-[10px] opacity-70">{{ getDayOfWeek(date) }}</span>
                <span class="text-lg font-bold">{{ new Date(date).getDate() }}</span>
            </div>
        </div>

        <div v-if="selectedTrip.data.currentTab === 'itinerary'" class="space-y-4">
            <div v-for="(item, idx) in sortedCurrentItinerary" :key="idx" class="itinerary-card p-4 rounded-2xl shadow-sm flex items-start border-l-4" :style="{ borderLeftColor: getItineraryColor(item.category) }">
                <div v-if="item.imageURL" class="itinerary-background" :style="{ backgroundImage: `url('${item.imageURL}')`, opacity: 0.15 }"></div>
                <div class="itinerary-content-wrapper">
                    <div class="itinerary-left-column">
                        <div class="itinerary-icon-circle" :style="{ backgroundColor: getItineraryColor(item.category) }">
                            <i :class="getItineraryIcon(item.category)" class="text-white text-xs"></i>
                        </div>
                        <p class="itinerary-time">{{ item.time || '未定' }}</p>
                    </div>
                    <div class="itinerary-main-content">
                        <h4 class="font-bold text-gray-800">{{ item.name }}</h4>
                        <p class="text-[10px] text-gray-400 truncate">{{ item.address }}</p>
                    </div>
                    <div class="action-button-group">
                        <button v-if="item.address" @click="openMap(item.address)" class="action-button-circle"><i class="fas fa-map-marker-alt text-[10px]"></i></button>
                    </div>
                </div>
            </div>
            <p v-if="!sortedCurrentItinerary.length" class="text-center text-gray-400 py-10 text-sm">今日尚無行程，點擊右下角新增。</p>
        </div>

        </section>

    <nav v-if="currentView === 'tripDetail'" class="fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-md border-t border-gray-100 max-w-[500px] mx-auto">
        <div class="flex h-16">
            <button v-for="tab in tripTabs" :key="tab.id" @click="selectedTrip.data.currentTab = tab.id"
                    :class="['flex-1 flex flex-col items-center justify-center transition-all', selectedTrip.data.currentTab === tab.id ? 'text-jp-blue-dark' : 'text-gray-300']">
                <i :class="[tab.icon, 'text-xl mb-1']"></i>
                <span class="text-[10px] font-bold">{{ tab.label }}</span>
            </button>
        </div>
    </nav>

    <div v-if="showAddTripModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-xs p-6 rounded-3xl shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-jp-blue-dark">新增旅遊</h3>
            <input type="text" v-model="newTripName" placeholder="旅程名稱" class="w-full p-3 border rounded-xl mb-3 text-sm bg-jp-white">
            <input type="date" v-model="newTripStartDate" class="w-full p-3 border rounded-xl mb-3 text-sm bg-jp-white">
            <input type="date" v-model="newTripEndDate" class="w-full p-3 border rounded-xl mb-6 text-sm bg-jp-white">
            <div class="flex space-x-3">
                <button @click="showAddTripModal = false" class="flex-1 py-3 text-gray-400 text-sm font-bold">取消</button>
                <button @click="addNewTrip" class="flex-1 py-3 bg-jp-blue-dark text-white rounded-xl text-sm font-bold shadow-lg">建立行程</button>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed, watch, onMounted } = Vue;

    createApp({
        setup() {
            const currentView = ref('home');
            const showCompleted = ref(false);
            const showAddTripModal = ref(false);
            const selectedTrip = ref(null);
            
            // 資料儲存庫
            const trips = ref([
                {
                    id: 1, name: '東京冬季漫步', type: '主題旅行', startDate: '2024-12-15', endDate: '2024-12-20', status: '進行中',
                    data: { currentTab: 'itinerary', selectedDateIndex: 0, dates: ['2024-12-15','2024-12-16','2024-12-17'], itinerary: [], shoppingList: [], expenses: [], hotels: [] }
                }
            ]);

            // === 本地儲存讀取 ===
            onMounted(() => {
                const saved = localStorage.getItem('travel_app_v2');
                if (saved) {
                    trips.ref = JSON.parse(saved);
                }
            });

            // === 自動儲存監聽 ===
            watch(trips, (newVal) => {
                localStorage.setItem('travel_app_v2', JSON.stringify(newVal));
            }, { deep: true });

            // 計算屬性與方法
            const filteredTrips = computed(() => showCompleted.value ? trips.value : trips.value.filter(t => t.status !== '已完成'));
            const sortedCurrentItinerary = computed(() => {
                if (!selectedTrip.value) return [];
                const date = selectedTrip.value.data.dates[selectedTrip.value.data.selectedDateIndex];
                return selectedTrip.value.data.itinerary.filter(i => i.date === date).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
            });

            const goToTrip = (trip) => { selectedTrip.value = trip; currentView.value = 'tripDetail'; };
            const goHome = () => { currentView.value = 'home'; };
            
            const addNewTrip = () => {
                const newId = Date.now();
                trips.value.push({
                    id: newId, name: newTripName.value, type: '未分類', startDate: newTripStartDate.value, endDate: newTripEndDate.value, status: '即將開始',
                    data: { currentTab: 'itinerary', selectedDateIndex: 0, dates: generateDates(newTripStartDate.value, newTripEndDate.value), itinerary: [], shoppingList: [], expenses: [], hotels: [] }
                });
                showAddTripModal.value = false;
            };

            const generateDates = (start, end) => {
                let arr = [], dt = new Date(start);
                while (dt <= new Date(end)) { arr.push(new Date(dt).toISOString().split('T')[0]); dt.setDate(dt.getDate() + 1); }
                return arr;
            };

            const getDayOfWeek = (d) => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d).getDay()];
            const getItineraryColor = (cat) => ({ 'food': '#E2B1B1', 'spot': '#4C7B7B', 'transport': '#A9CBB7' }[cat] || '#4C7B7B');
            const getItineraryIcon = (cat) => ({ 'food': 'fas fa-utensils', 'spot': 'fas fa-camera', 'transport': 'fas fa-train' }[cat] || 'fas fa-map-marker-alt');
            const openMap = (addr) => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`, '_blank');

            const newTripName = ref('');
            const newTripStartDate = ref('');
            const newTripEndDate = ref('');
            
            const tripTabs = [
                { id: 'itinerary', label: '行程', icon: 'fas fa-map-marked-alt' },
                { id: 'shopping', label: '購物', icon: 'fas fa-shopping-bag' },
                { id: 'expenses', label: '花費', icon: 'fas fa-wallet' },
                { id: 'info', label: '資訊', icon: 'fas fa-info-circle' }
            ];

            return {
                currentView, trips, filteredTrips, showCompleted, showAddTripModal, selectedTrip, sortedCurrentItinerary,
                newTripName, newTripStartDate, newTripEndDate, tripTabs,
                goToTrip, goHome, addNewTrip, getDayOfWeek, getItineraryColor, getItineraryIcon, openMap
            };
        }
    }).mount('#app');
</script>
</body>
</html>
