<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅遊紀錄平台 V011.3 終極佈局修正</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F4F7F6; margin: 0; padding: 0; color: #1F2937; }
        #app { max-width: 500px; margin: 0 auto; min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.05); background-color: white; padding-bottom: 80px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 基本 UI 元件 */
        .uniform-input, .uniform-textarea {
            width: 100%; background-color: #F3F4F6; border-radius: 1rem;
            border: 2px solid transparent; font-size: 14px; outline: none; transition: 0.2s;
        }
        .uniform-input { height: 54px; padding: 0 1.25rem; font-weight: 700; }
        .uniform-textarea { min-height: 100px; padding: 1rem 1.25rem; resize: none; }
        .uniform-input:focus, .uniform-textarea:focus { border-color: var(--main-theme); background-color: white; }

        .modal-overlay { background-color: rgba(0,0,0,0.4); backdrop-filter: blur(8px); position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* V011.3 行程卡片佈局核心 */
        .itinerary-card {
            display: flex; align-items: center; /* 讓左側圖示垂直居中 */
            padding: 1.2rem 1rem; background-color: white; border-radius: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-left-width: 4px;
            margin-bottom: 1rem;
        }
        
        .itinerary-main-content {
            flex: 1; margin-left: 0.85rem; min-width: 0;
        }

        /* 備註區塊修正：強制垂直滑動與兩行高度 */
        .itinerary-note-v3 {
            margin-top: 0.5rem;
            height: 42px; /* 固定兩行高度 */
            overflow-y: auto; /* 強制垂直滑動 */
            overflow-x: hidden; /* 禁止水平滑動 */
            background-color: #F3F4F6;
            border-radius: 0.6rem;
            padding: 6px 10px;
            font-size: 11px;
            color: #6B7280;
            line-height: 1.6; /* 適中的行高 */
            white-space: pre-wrap; /* 允許文字自動換行 */
            word-break: break-all; /* 避免長英文撐破邊框 */
            scrollbar-width: none;
        }
        .itinerary-note-v3::-webkit-scrollbar { display: none; }

        .action-buttons-vertical {
            display: flex; flex-direction: column; gap: 0.6rem; margin-left: 0.75rem;
        }

        /* 天氣 Banner 與 日期卡片樣式維持 */
        .weather-banner { margin: 16px; padding: 22px; border-radius: 1.8rem; display: flex; justify-content: space-between; align-items: center; min-height: 120px; box-shadow: 0 12px 24px -8px rgba(0,0,0,0.15); }
        .date-scroll-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 16px; }
        .date-card { min-width: 62px; height: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; border-radius: 1rem; border: 1px solid #E5E7EB; }
        .date-card.active { border-color: transparent; transform: scale(1.05); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div id="app" :style="{'--main-theme': currentThemeColor}">
    <header class="sticky top-0 z-50 p-4 flex justify-between items-center shadow-sm" :style="{ backgroundColor: currentView === 'home' ? '#4C7B7B' : currentThemeColor }">
        <h1 class="text-xl font-black flex items-center text-white">
            <button v-if="currentView !== 'home'" @click="goHome" class="mr-3"><i class="fas fa-arrow-left"></i></button>
            <span class="truncate max-w-[220px]">{{ currentView === 'home' ? '旅程隨身記 V011.3' : selectedTrip.name }}</span>
        </h1>
    </header>

    <section v-if="currentView === 'tripDetail' && selectedTrip">
        <div class="weather-banner" :style="{ background: `linear-gradient(135deg, ${currentThemeColor}, ${getPerfectDarkColor(currentThemeColor)})` }">
            <div class="flex flex-col text-white">
                <span class="text-white/70 text-[10px] font-black uppercase tracking-widest">Live Weather</span>
                <h2 class="text-xl font-black mt-0.5">{{ selectedTrip.name }}</h2>
                <div class="flex items-center mt-2">
                    <span class="text-3xl font-black mr-2">{{ currentWeather.temp }}°</span>
                    <div class="text-[10px] font-bold border-l border-white/30 pl-2"><p>{{ currentWeather.desc }}</p></div>
                </div>
            </div>
            <div class="text-right text-white"><i :class="currentWeather.icon" class="text-4xl"></i></div>
        </div>

        <div class="date-scroll-container hide-scrollbar">
            <div v-for="(date, idx) in selectedTrip.data.dates" :key="idx" @click="selectedTrip.data.selectedDateIndex = idx" class="date-card" :class="{ active: selectedTrip.data.selectedDateIndex === idx }" :style="selectedTrip.data.selectedDateIndex === idx ? { backgroundColor: currentThemeColor } : {}">
                <span class="text-[9px] font-black" :class="selectedTrip.data.selectedDateIndex === idx ? 'text-white' : 'text-gray-400'">{{ getMonthAbbr(date) }}</span>
                <span class="text-lg font-black" :class="selectedTrip.data.selectedDateIndex === idx ? 'text-white' : ''">{{ new Date(date).getDate() }}</span>
                <span class="text-[9px] font-bold" :class="selectedTrip.data.selectedDateIndex === idx ? 'text-white' : 'text-gray-400'">{{ getDayOfWeek(date) }}</span>
            </div>
        </div>

        <div class="p-4 pb-24">
            <div v-if="selectedTrip.data.currentTab === 'itinerary'" class="space-y-2">
                <div v-for="(item, idx) in currentDayItinerary" :key="idx" class="itinerary-card" :style="{ borderLeftColor: getAdaptiveColor(item.category) }">
                    
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white shadow-sm flex-shrink-0" :style="{ backgroundColor: getAdaptiveColor(item.category) }">
                        <i :class="getItineraryIcon(item.category)"></i>
                    </div>

                    <div class="itinerary-main-content">
                        <p class="text-[10px] font-bold text-gray-400">{{ item.time }}</p>
                        <h4 class="font-black text-sm leading-tight">{{ item.name }}</h4>
                        <div v-if="item.note" class="itinerary-note-v3">
                            {{ item.note }}
                        </div>
                    </div>

                    <div class="action-buttons-vertical flex-shrink-0">
                        <button @click="openEditItinerary(item)" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-300 active:bg-gray-200">
                            <i class="fas fa-pen text-[10px]"></i>
                        </button>
                        <button @click="openSmartMap(item)" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 active:bg-gray-200">
                            <i class="fas fa-location-arrow text-[10px]"></i>
                        </button>
                    </div>
                </div>
                <button @click="showAddItineraryModal = true" class="w-full py-4 bg-white border-2 border-dashed rounded-2xl font-black mt-4" :style="{ color: currentThemeColor, borderColor: currentThemeColor + '40' }">+ 新增行程項目</button>
            </div>
        </div>
    </section>

    <nav v-if="currentView === 'tripDetail'" class="fixed bottom-0 left-0 right-0 max-w-[500px] mx-auto bg-white/95 border-t flex h-20 pb-4 z-50">
        <button v-for="t in tripTabs" :key="t.id" @click="selectedTrip.data.currentTab = t.id" class="flex-1 flex flex-col items-center justify-center" :style="{ color: selectedTrip.data.currentTab === t.id ? currentThemeColor : '#D1D5DB' }">
            <i :class="[t.icon, 'text-xl mb-1']"></i><span class="text-[10px] font-black">{{ t.label }}</span>
        </button>
    </nav>

    <div v-if="showAddItineraryModal || showEditItineraryModal" class="modal-overlay">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl border-t-8 overflow-y-auto max-h-[90vh]" :style="{ borderColor: currentThemeColor }">
            <h3 class="font-black text-xl mb-6">行程細節</h3>
            <div class="space-y-4">
                <input v-model="(showAddItineraryModal ? newItinerary : editingItinerary).name" placeholder="景點名稱" class="uniform-input">
                <div class="grid grid-cols-2 gap-4">
                    <input type="time" v-model="(showAddItineraryModal ? newItinerary : editingItinerary).time" class="uniform-input">
                    <select v-model="(showAddItineraryModal ? newItinerary : editingItinerary).category" class="uniform-input"><option value="spot">景點</option><option value="food">美食</option><option value="transport">交通</option></select>
                </div>
                <input v-model="(showAddItineraryModal ? newItinerary : editingItinerary).address" placeholder="地址 (地圖導航)" class="uniform-input">
                <textarea v-model="(showAddItineraryModal ? newItinerary : editingItinerary).note" placeholder="備註筆記..." class="uniform-textarea"></textarea>
            </div>
            <div class="flex space-x-3 mt-8">
                <button @click="showAddItineraryModal = false; showEditItineraryModal = false" class="flex-1 py-4 text-gray-400 font-bold">取消</button>
                <button @click="showAddItineraryModal ? addItinerary() : saveItinerary()" class="flex-1 py-4 text-white rounded-2xl font-black shadow-lg" :style="{ backgroundColor: currentThemeColor }">儲存</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 邏輯部分維持 V011.2，僅為了完整性保留核心 setup
    const { createApp, ref, computed, watch, onMounted } = Vue;
    createApp({
        setup() {
            const currentView = ref('home'), selectedTrip = ref(null), filterCategory = ref('全部');
            const showAddItineraryModal = ref(false), showEditItineraryModal = ref(false);
            const trips = ref([]), newItinerary = ref({ name: '', time: '09:00', category: 'spot', address:'', note: '' }), editingItinerary = ref({});

            onMounted(() => { const data = localStorage.getItem('TRAVEL_V11'); if (data) trips.value = JSON.parse(data); });
            watch(trips, (v) => localStorage.setItem('TRAVEL_V11', JSON.stringify(v)), { deep: true });

            const currentThemeColor = computed(() => selectedTrip.value?.themeColor || '#4C7B7B');
            const getPerfectDarkColor = (hex) => hex; // 簡化處理
            
            const currentWeather = computed(() => ({ temp: 24, desc: 'Sunny', icon: 'fas fa-sun' }));
            const goToTrip = (t) => { selectedTrip.value = t; currentView.value = 'tripDetail'; };
            const goHome = () => currentView.value = 'home';

            const addItinerary = () => { selectedTrip.value.data.itinerary.push({ ...newItinerary.value, id: Date.now(), date: selectedTrip.value.data.dates[selectedTrip.value.data.selectedDateIndex] }); showAddItineraryModal.value = false; newItinerary.value = { name: '', time: '09:00', category: 'spot', address:'', note: '' }; };
            const openEditItinerary = (i) => { editingItinerary.value = { ...i }; showEditItineraryModal.value = true; };
            const saveItinerary = () => { const idx = selectedTrip.value.data.itinerary.findIndex(x => x.id === editingItinerary.value.id); selectedTrip.value.data.itinerary[idx] = { ...editingItinerary.value }; showEditItineraryModal.value = false; };
            
            const openSmartMap = (item) => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.address || item.name)}`, '_blank');
            const getAdaptiveColor = (type) => ({ spot: currentThemeColor.value, food: '#E2B1B1', transport: '#8C9A9E' }[type] || currentThemeColor.value);
            const getItineraryIcon = (c) => ({ spot: 'fas fa-map-pin', food: 'fas fa-utensils', transport: 'fas fa-car' }[c] || 'fas fa-star');
            const currentDayItinerary = computed(() => selectedTrip.value ? selectedTrip.value.data.itinerary.filter(i => i.date === selectedTrip.value.data.dates[selectedTrip.value.data.selectedDateIndex]).sort((a,b) => a.time.localeCompare(b.time)) : []);

            return {
                currentView, selectedTrip, currentThemeColor, showAddItineraryModal, showEditItineraryModal,
                newItinerary, editingItinerary, currentWeather, currentDayItinerary,
                tripTabs: [{id:'itinerary', label:'行程', icon:'fas fa-route'}, {id:'shopping', label:'清單', icon:'fas fa-tasks'}, {id:'expenses', label:'花費', icon:'fas fa-wallet'}, {id:'info', label:'住宿', icon:'fas fa-bed'}],
                goToTrip, goHome, addItinerary, openEditItinerary, saveItinerary, openSmartMap, getMonthAbbr: (d) => 'DEC', getDayOfWeek: (d) => 'WED', getAdaptiveColor, getItineraryIcon, getPerfectDarkColor, formatNumber: (n) => n
            };
        }
    }).mount('#app');
</script>
</body>
</html>
